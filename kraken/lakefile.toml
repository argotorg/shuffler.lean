name = "PermuteKraken"
version = "0.1.0"
defaultTargets = ["PermuteKraken", "BbuKraken", "ProofKit", "ProofKitTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false

[[require]]
name = "Kraken"
git = "https://github.com/AeneasVerif/kraken.git"
rev = "2fd79ae53504b5db4407de57efa9d4bd4fbc3e2b"

[[lean_lib]]
name = "PermuteKraken"

[[lean_exe]]
name = "model"
root = "ModelMain"

[[lean_lib]]
name = "BbuKraken"

[[lean_exe]]
name = "bbu_model"
root = "BbuModelMain"

[[lean_lib]]
name = "ProofKit"

[[lean_lib]]
name = "ProofKitTest"

# The flat model of build_bottom_up, run by test/bbu_diff.sh.
[[lean_exe]]
name = "bbu_flat"
srcDir = "test"
root = "BbuFlatMain"

# The flat model and the list model of emission_pop, run by test/pop_diff.sh.
[[lean_exe]]
name = "pop_flat"
srcDir = "test"
root = "PopFlatMain"

# The flat model and the list model of remove_surplus, run by test/surplus_diff.sh.
[[lean_exe]]
name = "surplus_flat"
srcDir = "test"
root = "SurplusFlatMain"

# The flat and list models of permute_at_lowest_height, run by test/lowest_diff.sh.
[[lean_exe]]
name = "lowest_flat"
srcDir = "test"
root = "LowestFlatMain"

# The flat model of plan, run by test/plan_diff.sh.
[[lean_exe]]
name = "plan_flat"
srcDir = "test"
root = "PlanFlatMain"
