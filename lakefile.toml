name = "shuffler-lean"
version = "0.1.0"
defaultTargets = ["Shuffler", "Verification", "ShufflerBridge", "Theorems"]
testDriver = "Tests"
allowNonModules = true
moreLeanArgs = ["-E", "warning"]

[[lean_lib]]
name = "Shuffler"

[[lean_lib]]
name = "Verification"

[[lean_lib]]
name = "Theorems"
srcDir = "kraken"
roots = ["Theorems.Main"]
globs = ["Theorems.+"]

[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4-nightly-testing.git"
rev = "d107e3b8fafb81ea3e41a9e27ac7db46b47ad738"

[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "8bca74780c076fc173eb623dc0bed36d87bd7399"

[[require]]
name = "ShufflerKraken"
path = "kraken"

[[lean_lib]]
name = "Fuzz"
roots = ["Fuzz.Oracle"]

# Correspondence proofs for emission, spills, and the planner.
[[lean_lib]]
name = "ShufflerBridge"
srcDir = "kraken"
globs = ["ShufflerBridge.+"]

# The original buildBottomUp, run by kraken/test/bbu_diff.sh.
[[lean_exe]]
name = "bbu_original"
srcDir = "kraken/test"
root = "BuildBottomUpMain"

# The PR31 buildBottomUp, run by kraken/test/bbu_diff.sh.
[[lean_exe]]
name = "bbu_pr31"
srcDir = "kraken/test"
root = "BbuPr31Main"

# The PR31 Emission.State.pop, run by kraken/test/pop_diff.sh.
[[lean_exe]]
name = "pop_pr31"
srcDir = "kraken/test"
root = "PopPr31Main"

# The PR31 permuteAtLowestHeight, through Fuzz/Oracle.lean, run by kraken/test/lowest_diff.sh.
[[lean_exe]]
name = "lowest_pr31"
srcDir = "kraken/test"
root = "LowestPr31Main"
