name = "shuffler-lean"
version = "0.1.0"
defaultTargets = ["Shuffler"]
testDriver = "Tests"

[[lean_lib]]
name = "Shuffler"

[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "Fuzz"
roots = ["Fuzz.Oracle"]

# The Kraken models of permute and buildBottomUp, and the proofs that they equal the originals.
[[lean_lib]]
name = "BbuBridge"
srcDir = "kraken"
globs = ["PermuteKraken.Model", "PermuteKraken.Trace", "BbuKraken.Model", "BbuKraken.ModelLemmas", "BbuKraken.MapModel", "BbuKraken.ModelLowest", "BbuBridge.+"]

# The originals of permute and buildBottomUp, run by kraken/test/diff.sh and bbu_diff.sh.
[[lean_exe]]
name = "original"
srcDir = "kraken/test"
root = "OriginalMain"

[[lean_exe]]
name = "bbu_original"
srcDir = "kraken/test"
root = "BuildBottomUpMain"

# The PR31 buildBottomUp, run by kraken/test/bbu_diff.sh.
[[lean_exe]]
name = "bbu_pr31"
srcDir = "kraken/test"
root = "BbuPr31Main"

# The PR31 Emission.State.pop, run by kraken/test/pop_diff.sh.
[[lean_exe]]
name = "pop_pr31"
srcDir = "kraken/test"
root = "PopPr31Main"

# The PR31 permuteAtLowestHeight, through Fuzz/Oracle.lean, run by kraken/test/lowest_diff.sh.
[[lean_exe]]
name = "lowest_pr31"
srcDir = "kraken/test"
root = "LowestPr31Main"

# The flat model of the spill set, and the proofs that it equals SpillSet.add and
# SpillSet.is_spilled of PR31. Not a default target.
[[lean_lib]]
name = "SpillBridge"
srcDir = "kraken"
globs = ["BbuKraken.FlatModel", "BbuKraken.FlatSpill", "SpillBridge.+"]
