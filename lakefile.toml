name = "shuffler-lean"
version = "0.1.0"
defaultTargets = ["Shuffler", "Verification", "BbuBridge", "SpillBridge", "PlanBridge"]
testDriver = "Tests"
allowNonModules = true
moreLeanArgs = ["-E", "warning"]

[[lean_lib]]
name = "Shuffler"

[[lean_lib]]
name = "Verification"

[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4-nightly-testing.git"
rev = "d107e3b8fafb81ea3e41a9e27ac7db46b47ad738"

[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "8bca74780c076fc173eb623dc0bed36d87bd7399"

[[require]]
name = "PermuteKraken"
path = "kraken"

[[lean_lib]]
name = "Fuzz"
roots = ["Fuzz.Oracle"]

# The Kraken models of permute and buildBottomUp, and the proofs that they equal the originals.
[[lean_lib]]
name = "BbuBridge"
srcDir = "kraken"
globs = ["BbuBridge.+"]

# The originals of permute and buildBottomUp, run by kraken/test/diff.sh and bbu_diff.sh.
[[lean_exe]]
name = "original"
srcDir = "kraken/test"
root = "OriginalMain"

[[lean_exe]]
name = "bbu_original"
srcDir = "kraken/test"
root = "BuildBottomUpMain"

# The PR31 buildBottomUp, run by kraken/test/bbu_diff.sh.
[[lean_exe]]
name = "bbu_pr31"
srcDir = "kraken/test"
root = "BbuPr31Main"

# The PR31 Emission.State.pop, run by kraken/test/pop_diff.sh.
[[lean_exe]]
name = "pop_pr31"
srcDir = "kraken/test"
root = "PopPr31Main"

# The PR31 permuteAtLowestHeight, through Fuzz/Oracle.lean, run by kraken/test/lowest_diff.sh.
[[lean_exe]]
name = "lowest_pr31"
srcDir = "kraken/test"
root = "LowestPr31Main"

# The flat model of the spill set, and the proofs that it equals SpillSet.add and
# SpillSet.is_spilled of PR31.
[[lean_lib]]
name = "SpillBridge"
srcDir = "kraken"
globs = ["SpillBridge.+"]

# The flat model of Planner.run, and the proofs that it equals Planner.run of PR31.
[[lean_lib]]
name = "PlanBridge"
srcDir = "kraken"
globs = ["PlanBridge.+"]
