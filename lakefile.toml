name = "shuffler-lean"
version = "0.1.0"
defaultTargets = ["Shuffler"]
testDriver = "Tests"

[[lean_lib]]
name = "Shuffler"

[[lean_lib]]
name = "Tests"
globs = ["Tests.+"]

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[require]]
name = "batteries"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "Fuzz"
roots = ["Fuzz.Oracle"]

# The Kraken models of permute and buildBottomUp, and the proofs that they equal the originals.
[[lean_lib]]
name = "BbuBridge"
srcDir = "kraken"
globs = ["PermuteKraken.Model", "PermuteKraken.Trace", "BbuKraken.Model", "BbuKraken.ModelLemmas", "BbuBridge.+"]

# The originals of permute and buildBottomUp, run by kraken/test/diff.sh and bbu_diff.sh.
[[lean_exe]]
name = "original"
srcDir = "kraken/test"
root = "OriginalMain"

[[lean_exe]]
name = "bbu_original"
srcDir = "kraken/test"
root = "BuildBottomUpMain"

# The PR31 buildBottomUp, run by kraken/test/bbu_diff.sh.
[[lean_exe]]
name = "bbu_pr31"
srcDir = "kraken/test"
root = "BbuPr31Main"
