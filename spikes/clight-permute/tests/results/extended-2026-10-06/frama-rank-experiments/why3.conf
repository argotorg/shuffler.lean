[strategy]
code = "t split_vc exit"
desc = "Split@ the@ VC@ into@ subgoals"
name = "Split_VC"
shortcut = "s"

[strategy]
code = "start:
c CVC5,1.3.4 1. 1000
c Z3,4.16.0 1. 1000
t split_vc start
c CVC5,1.3.4 5. 2000 | Z3,4.16.0 5. 2000
t introduce_premises afterintro
afterintro:
t inline_goal afterinline
g trylongertime
afterinline:
t split_all_full start
trylongertime:
c CVC5,1.3.4 30. 4000 | Z3,4.16.0 30. 4000
"
